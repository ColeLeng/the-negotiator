[project]
name = "the-negotiator"
version = "0.1.0"
description = "Voice agents that call, compare, and haggle — agent-to-agent negotiation. Hack-Nation x ElevenLabs Challenge 01."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["negotiator", "negotiator.agents", "negotiator.comms", "app"]
