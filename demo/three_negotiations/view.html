<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Negotiator — Three Negotiations</title>
<style>
  /*
   * Citable design tokens (citable-platform/design-tokens/*.json, as compiled to
   * citable-platform/frontend/src/{styles/tokens.css,index.css}). Brand primitives
   * and the light/dark semantic aliasing are reproduced verbatim; this page has no
   * build step, so the values are inlined rather than @import'd from the token CSS.
   */
  :root {
    color-scheme: dark;
    /* brand primitives */
    --color-obsidian:   #161616;
    --color-pearl:      #F2F1ED;
    --color-chile-rojo: #AE431E;
    --color-terracota:  #D06224;
    --color-olive:      #8A8635;
    --color-sunset:     #EAC891;
    --color-grey-200:   #D0D0D0;
    --color-grey-400:   #7A7A7A;
    --color-grey-600:   #3A3A3A;

    /* semantic (dark theme) */
    --page:        var(--color-obsidian);
    --surface:     var(--color-obsidian);
    --surface-2:   var(--color-grey-600);
    --text-1:      var(--color-pearl);
    --text-2:      var(--color-grey-200);
    --muted:       var(--color-grey-400);
    --gridline:    var(--color-grey-600);
    --border:      var(--color-grey-600);

    /* chart palette -> node identity (citable-platform's --chart-1..5) */
    --estimator:      hsl(173, 58%, 39%);   /* chart-3 */
    --caller:         var(--color-olive);   /* chart-2 */
    --orchestrator:   var(--color-terracota); /* chart-5 */
    --recommendation: var(--color-chile-rojo); /* chart-1 */
    --guard:          var(--color-chile-rojo); /* chart-1 */
    --buyer:          hsl(173, 58%, 39%);   /* chart-3 */
    --seller:         var(--color-sunset);  /* chart-4 */
    --blackboard:     var(--color-olive);   /* chart-2 */

    --good:     var(--color-olive);
    --critical: var(--color-chile-rojo);

    --font-brand: "IBM Plex Sans Variable", "IBM Plex Sans", sans-serif;
    --font-ui:    "Inter Variable", Inter, sans-serif;
    --font-mono:  "IBM Plex Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --page:      var(--color-pearl);
      --surface:   var(--color-pearl);
      --surface-2: #E8E7E2;
      --text-1:    var(--color-obsidian);
      --text-2:    var(--color-grey-400);
      --muted:     var(--color-grey-400);
      --gridline:  #DEDDD8;
      --border:    #DEDDD8;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-1);
    font: 13px/1.5 var(--font-ui);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: var(--space-2, 16px);
    padding: 10px var(--space-2, 16px); border-bottom: 1px solid var(--border); flex: none;
  }
  header h1 { font: 600 14px var(--font-brand); margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: var(--radius-full, 128px); border: 1px solid var(--border);
    font-size: 11px; color: var(--text-2);
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); }
  .pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pill.done .dot { background: var(--estimator); }
  .pill.error .dot { background: var(--critical); }
  button.reconnect {
    margin-left: auto; background: var(--primary, var(--color-chile-rojo)); color: var(--color-pearl);
    border: 1px solid transparent; border-radius: var(--radius-md, 8px); padding: 6px 14px;
    font: 500 12px var(--font-ui); cursor: pointer;
  }
  button.reconnect:hover { opacity: 0.9; }

  main {
    flex: 1; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: var(--space-1, 8px);
    padding: var(--space-2, 16px) var(--space-2, 16px) 14px; min-height: 0;
  }

  .section-label {
    color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: var(--tracking-overline, 0.04em);
  }

  /* -------- call indicator -------- */
  #call-indicator { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #call-indicator .n { font-size: 11px; color: var(--muted); }
  #call-indicator .title { font: 700 17px var(--font-brand); }
  #call-indicator .proves {
    font-size: 10.5px; color: var(--orchestrator);
    border: 1px solid color-mix(in srgb, var(--orchestrator) 45%, transparent);
    border-radius: var(--radius-sm, 4px); padding: 2px 8px;
  }
  #call-tabs { margin-left: auto; display: flex; gap: 6px; }
  .call-tab {
    font-size: 10.5px; padding: 3px 9px; border-radius: var(--radius-full, 128px);
    border: 1px solid var(--border); color: var(--muted);
  }
  .call-tab.active { color: var(--text-1); border-color: var(--text-1); }
  .call-tab.done { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }

  /* -------- one unified, full-pipeline architecture diagram -------- */
  #diagram-wrap {
    position: relative;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg, 16px);
    padding: 10px 14px 14px; min-height: 0; display: flex; flex-direction: column;
  }
  #diagram-canvas { position: relative; flex: 1; min-height: 280px; }
  #diagram-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .node {
    position: absolute;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md, 8px);
    background: var(--surface-2);
    padding: 8px 10px;
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }
  .node .title { font: 600 12px var(--font-ui); color: var(--text-1); }
  .node .subtitle { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .node.pulse {
    border-color: var(--node-color, var(--text-1));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color, var(--text-1)) 30%, transparent);
    background: color-mix(in srgb, var(--node-color, var(--text-1)) 14%, var(--surface-2));
  }

  /* -------- calls summary strip -------- */
  #calls-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .call-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md, 8px); padding: 8px 12px; }
  .call-card.active { border-color: var(--text-1); }
  .call-card .name { font: 700 11.5px var(--font-ui); }
  .call-card .checks { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .check-chip {
    font-size: 9.5px; color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius-full, 128px); padding: 1px 6px;
  }
  .check-chip.done { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }

  /* -------- latest turn -------- */
  #latest-turn {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md, 8px);
    padding: 10px 14px; display: flex; align-items: center; gap: 12px; min-height: 46px;
  }
  #latest-turn .tag {
    font: 700 10px var(--font-ui); text-transform: uppercase; letter-spacing: var(--tracking-overline, 0.04em);
    padding: 2px 8px; border-radius: var(--radius-sm, 4px); background: var(--surface-2); color: var(--text-2); flex: none;
  }
  #latest-turn .text { flex: 1; color: var(--text-1); }
  #latest-turn .price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-2); flex: none; }
</style>
</head>
<body>
  <header>
    <h1>The Negotiator</h1>
    <span class="sub">three negotiations · Cole voices all three</span>
    <span id="status-pill" class="pill"><span class="dot"></span><span id="status-label">connecting…</span></span>
    <button class="reconnect" id="reconnect">Run again</button>
  </header>
  <main>
    <div id="call-indicator">
      <span class="n" id="call-n">Call — of 3</span>
      <span class="title" id="call-title">—</span>
      <span class="proves" id="call-proves"></span>
      <div id="call-tabs"></div>
    </div>

    <div id="diagram-wrap">
      <div class="section-label">Architecture</div>
      <div id="diagram-canvas"></div>
    </div>

    <div id="calls-strip"></div>

    <div id="latest-turn">
      <span class="tag">latest turn</span>
      <span class="text" id="latest-text">waiting for the calls to start…</span>
      <span class="price" id="latest-price"></span>
    </div>
  </main>

  <script>
    // One diagram for the WHOLE required loop (intake -> calls -> negotiation ->
    // recommendation), not just the negotiation step -- the same shape as the
    // main /trace/view panel, so a viewer sees the full system, not a fragment.
    const STYLE_ORDER = ["tough_but_fair", "stonewaller", "upseller"];
    const STYLE_META = {
      tough_but_fair: { title: "Tough but fair", proves: "Price moves during the call" },
      stonewaller:    { title: "Won’t quote by phone", proves: "Every call ends with a real outcome" },
      upseller:       { title: "Upseller", proves: "Quotes are itemized and comparable" },
    };
    const CHECK_LABELS = {
      price_moves: "price moves",
      structured_ending: "structured ending",
      ai_disclosure: "AI discloses",
      friction_handled: "friction handled",
      honest_leverage_only: "real leverage only",
      callback_or_range_extracted: "callback/range",
      fees_itemized: "fees itemized",
    };

    const NODES = [
      { id: "estimator",      title: "Estimator",      subtitle: "text → ProductSpec",     x: 2,  y: 4,  w: 16, color: "--estimator" },
      { id: "caller",         title: "Caller",         subtitle: "search → RankedOptions",  x: 20, y: 4,  w: 16, color: "--caller" },
      { id: "orchestrator",   title: "Orchestrator",   subtitle: "runs each call",          x: 38, y: 4,  w: 18, color: "--orchestrator" },
      { id: "recommendation", title: "Recommendation", subtitle: "best closed deal",        x: 80, y: 4,  w: 18, color: "--recommendation" },

      { id: "guard",  title: "Guard",       subtitle: "honesty + anti-injection", x: 38, y: 42, w: 16, color: "--guard" },
      { id: "buyer",  title: "Buyer Agent", subtitle: "maximize utility",         x: 56, y: 42, w: 16, color: "--buyer" },
      { id: "seller", title: "Seller",      subtitle: "Cole's voice, scripted",   x: 75, y: 42, w: 18, color: "--seller" },

      { id: "blackboard", title: "Blackboard", subtitle: "shared live BATNA", x: 56, y: 76, w: 16, color: "--blackboard" },
    ];
    const EDGES = [
      ["estimator", "caller"],
      ["caller", "orchestrator"],
      ["orchestrator", "guard"],
      ["guard", "buyer"],
      ["buyer", "seller", true],
      ["buyer", "blackboard", true, true], // bidirectional, dashed
      ["orchestrator", "recommendation"],
    ];

    const canvas = document.getElementById("diagram-canvas");
    const nodeEls = {};

    function renderDiagram() {
      canvas.innerHTML = "";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs>`;
      const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));
      for (const [fromId, toId, bidir, dashed] of EDGES) {
        const a = byId[fromId], b = byId[toId];
        const ax = a.x + a.w, ay = a.y + 4.5;
        const bx = b.x, by = b.y + 4.5;
        const sameRow = Math.abs(a.y - b.y) < 1;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        let d;
        if (sameRow) {
          d = `M ${ax} ${ay} L ${bx} ${by}`;
        } else {
          const midY = (ay + by) / 2;
          const cx = a.x + a.w / 2;
          d = `M ${cx} ${a.y + 9} L ${cx} ${midY} L ${b.x + b.w / 2} ${midY} L ${b.x + b.w / 2} ${b.y}`;
        }
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "var(--gridline)");
        path.setAttribute("stroke-width", "0.5");
        path.setAttribute("marker-end", "url(#arrow)");
        if (bidir) path.setAttribute("marker-start", "url(#arrow)");
        if (dashed) path.setAttribute("stroke-dasharray", "1.6,1.4");
        svg.appendChild(path);
      }
      canvas.appendChild(svg);

      for (const n of NODES) {
        const el = document.createElement("div");
        el.className = "node";
        el.style.setProperty("--node-color", `var(${n.color})`);
        Object.assign(el.style, { left: n.x + "%", top: n.y + "%", width: n.w + "%" });
        el.innerHTML = `<div class="title">${n.title}</div><div class="subtitle">${n.subtitle}</div>`;
        canvas.appendChild(el);
        nodeEls[n.id] = el;
      }
    }

    function pulse(nodeId) {
      const el = nodeEls[nodeId];
      if (!el) return;
      el.classList.add("pulse");
      clearTimeout(el._pulseTimer);
      el._pulseTimer = setTimeout(() => el.classList.remove("pulse"), 700);
    }

    // Map a TraceEvent onto the node(s) it should light up.
    function nodesForEvent(evt) {
      if (evt.kind === "stage") return [evt.actor];                         // estimator | caller
      if (evt.kind === "call_start" || evt.kind === "call_end") return ["orchestrator"];
      if (evt.kind === "recommendation") return ["recommendation"];
      if (evt.kind === "blackboard_update") return ["blackboard"];
      if (evt.kind === "guard_intervention" || evt.kind === "honesty_check") return ["buyer", "guard"];
      if (evt.actor === "buyer") return ["buyer"];
      if (evt.actor === "seller") return ["seller"];
      return [];
    }

    // ---------------------------------------------------------------------
    const statusPill = document.getElementById("status-pill");
    const statusLabel = document.getElementById("status-label");
    const reconnectBtn = document.getElementById("reconnect");
    const callN = document.getElementById("call-n");
    const callTitle = document.getElementById("call-title");
    const callProves = document.getElementById("call-proves");
    const callTabs = document.getElementById("call-tabs");
    const callsStrip = document.getElementById("calls-strip");
    const latestText = document.getElementById("latest-text");
    const latestPrice = document.getElementById("latest-price");

    const callCards = {};
    let es = null;

    function setStatus(kind, text) { statusPill.className = "pill " + kind; statusLabel.textContent = text; }

    function fmtUsd(n) {
      if (n === null || n === undefined || Number.isNaN(n)) return "—";
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);
    }

    function buildStrip() {
      callsStrip.innerHTML = "";
      callTabs.innerHTML = "";
      STYLE_ORDER.forEach((style, i) => {
        const meta = STYLE_META[style];
        const card = document.createElement("div");
        card.className = "call-card";
        card.innerHTML = `<div class="name">${i + 1}. ${meta.title}</div><div class="checks"></div>`;
        callsStrip.appendChild(card);
        callCards[style] = { card, checksEl: card.querySelector(".checks") };

        const tab = document.createElement("span");
        tab.className = "call-tab";
        tab.textContent = i + 1;
        callTabs.appendChild(tab);
        callCards[style].tab = tab;
      });
    }

    function setActiveCall(style) {
      STYLE_ORDER.forEach((s) => {
        callCards[s].card.classList.toggle("active", s === style);
        if (s !== style) callCards[s].tab.classList.remove("active");
      });
      callCards[style].tab.classList.add("active");
    }

    function markCallDone(style, checklist) {
      callCards[style].tab.classList.remove("active");
      callCards[style].tab.classList.add("done");
      callCards[style].checksEl.innerHTML = Object.entries(checklist).map(([k, done]) =>
        `<span class="check-chip ${done ? "done" : ""}">${CHECK_LABELS[k] || k}</span>`
      ).join("");
    }

    function handleEvent(evt) {
      for (const nodeId of nodesForEvent(evt)) pulse(nodeId);

      const style = evt.detail && evt.detail.style;
      if (evt.kind === "call_start" && style) {
        const i = STYLE_ORDER.indexOf(style);
        const meta = STYLE_META[style];
        callN.textContent = `Call ${i + 1} of 3`;
        callTitle.textContent = meta.title;
        callProves.textContent = meta.proves;
        setActiveCall(style);
        return;
      }
      if (evt.kind === "call_end" && style) {
        markCallDone(style, evt.detail.checklist || {});
        return;
      }

      const text = (evt.detail && (evt.detail.text || evt.detail.rationale)) || evt.label;
      latestText.innerHTML = `<strong>${evt.actor || evt.kind}</strong> — ${text}`;
      latestPrice.textContent = evt.price != null ? fmtUsd(evt.price) : "";
    }

    function connect() {
      buildStrip();
      callN.textContent = "Call — of 3";
      callTitle.textContent = "—";
      callProves.textContent = "";
      latestText.textContent = "waiting for the calls to start…";
      latestPrice.textContent = "";
      Object.values(nodeEls).forEach((el) => el.classList.remove("pulse"));
      setStatus("live", "connecting…");
      if (es) es.close();
      es = new EventSource("/demo/three-negotiations/stream");
      es.addEventListener("trace", (ev) => { setStatus("live", "live"); handleEvent(JSON.parse(ev.data)); });
      es.addEventListener("done", () => { setStatus("done", "done"); es.close(); });
      es.onerror = () => { setStatus("error", "disconnected — click Run again"); es.close(); };
    }

    renderDiagram();
    reconnectBtn.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
