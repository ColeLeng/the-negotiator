<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Negotiator — Live Agent Trace</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #202020;
    --text-1:      #ffffff;
    --text-2:      #c3c2b7;
    --muted:       #898781;
    --gridline:    #2c2c2a;
    --border:      rgba(255,255,255,0.10);

    --buyer:        #3987e5;
    --seller:       #d95926;
    --orchestrator: #9085e9;
    --guard:        #e66767;

    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --page:        #f9f9f7;
      --surface:     #fcfcfb;
      --surface-2:   #f1f0ec;
      --text-1:      #0b0b0b;
      --text-2:      #52514e;
      --muted:       #898781;
      --gridline:    #e1e0d9;
      --border:      rgba(11,11,11,0.10);

      --buyer:        #2a78d6;
      --seller:       #eb6834;
      --orchestrator: #4a3aa7;
      --guard:        #e34948;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-1);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header .sub { color: var(--muted); font-size: 12px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-2);
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); }
  .pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pill.done .dot { background: var(--buyer); }
  .pill.error .dot { background: var(--critical); }

  button.reconnect {
    margin-left: auto;
    background: var(--surface-2);
    color: var(--text-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  button.reconnect:hover { border-color: var(--muted); }

  main {
    flex: 1;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 12px;
    padding: 12px 16px 16px;
    min-height: 0;
  }

  #sessions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 8px;
  }
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .session-card .vendor {
    font-size: 12px;
    color: var(--text-2);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  .session-card .status {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 1px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-2);
    flex: none;
  }
  .session-card .status.agreed     { color: var(--good);     border-color: color-mix(in srgb, var(--good) 50%, transparent); }
  .session-card .status.walked_away{ color: var(--warning);  border-color: color-mix(in srgb, var(--warning) 50%, transparent); }
  .session-card .status.refused    { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 50%, transparent); }
  .session-card .price {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
    transition: color 120ms ease;
  }
  .session-card .price.flash { color: var(--good); }

  #feed-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #feed-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--gridline);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    flex: none;
  }
  #feed {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .row {
    display: grid;
    grid-template-columns: 74px 96px 1fr 84px;
    gap: 10px;
    align-items: baseline;
    padding: 5px 14px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  .row:last-child { border-bottom: none; }
  .row .ts { color: var(--muted); font-size: 11px; }
  .row .actor {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .row .actor.buyer        { color: var(--buyer); }
  .row .actor.seller       { color: var(--seller); }
  .row .actor.orchestrator { color: var(--orchestrator); }
  .row .label { color: var(--text-1); }
  .row .label .rationale { color: var(--text-2); display: block; font-size: 11.5px; margin-top: 1px; }
  .row .price { text-align: right; color: var(--text-2); }
  .row.guard_intervention { background: color-mix(in srgb, var(--guard) 8%, transparent); }
  .row.guard_intervention .actor { color: var(--guard); }
  .row.session_spawned .label,
  .row.session_end .label,
  .row.recommendation .label { font-weight: 600; }
  .row.recommendation { background: color-mix(in srgb, var(--good) 8%, transparent); }

  #feed::-webkit-scrollbar { width: 8px; }
  #feed::-webkit-scrollbar-thumb { background: var(--gridline); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>The Negotiator</h1>
    <span class="sub">live agent trace</span>
    <span id="status-pill" class="pill"><span class="dot"></span><span id="status-label">connecting…</span></span>
    <button class="reconnect" id="reconnect">Run again</button>
  </header>
  <main>
    <div id="sessions"></div>
    <div id="feed-wrap">
      <div id="feed-header">Agent event log</div>
      <div id="feed"></div>
    </div>
  </main>

  <script>
    const sessionsEl = document.getElementById("sessions");
    const feedEl = document.getElementById("feed");
    const statusPill = document.getElementById("status-pill");
    const statusLabel = document.getElementById("status-label");
    const reconnectBtn = document.getElementById("reconnect");

    const sessions = new Map(); // session_id -> {vendor, price, status, el, priceEl}
    let es = null;
    const MAX_ROWS = 400;

    function setStatus(kind, text) {
      statusPill.className = "pill " + kind;
      statusLabel.textContent = text;
    }

    function fmtUsd(n) {
      if (n === null || n === undefined || Number.isNaN(n)) return "—";
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);
    }

    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      } catch { return ""; }
    }

    function sessionCard(sessionId, vendor) {
      const card = document.createElement("div");
      card.className = "session-card";
      card.innerHTML = `
        <div class="vendor"><span>${vendor || sessionId}</span><span class="status"></span></div>
        <div class="price">—</div>
      `;
      sessionsEl.appendChild(card);
      return {
        el: card,
        statusEl: card.querySelector(".status"),
        priceEl: card.querySelector(".price"),
      };
    }

    function upsertSession(sessionId, { vendor, price, status }) {
      let s = sessions.get(sessionId);
      if (!s) {
        s = { vendor, price: null, status: "in_progress", ...sessionCard(sessionId, vendor) };
        sessions.set(sessionId, s);
      }
      if (vendor) s.vendor = vendor;
      if (status) {
        s.status = status;
        s.statusEl.textContent = status;
        s.statusEl.className = "status " + status;
      }
      if (price !== null && price !== undefined) {
        s.price = price;
        s.priceEl.textContent = fmtUsd(price);
        s.priceEl.classList.add("flash");
        setTimeout(() => s.priceEl.classList.remove("flash"), 220);
      }
    }

    function appendRow(evt) {
      const row = document.createElement("div");
      row.className = "row " + evt.kind;
      const actorClass = evt.actor || "";
      row.innerHTML = `
        <div class="ts">${fmtTime(evt.ts)}</div>
        <div class="actor ${actorClass}">${evt.actor || evt.kind.replace("_", " ")}</div>
        <div class="label">${evt.label}${evt.detail && evt.detail.rationale ? `<span class="rationale">${evt.detail.rationale}</span>` : ""}</div>
        <div class="price">${evt.price !== null && evt.price !== undefined ? fmtUsd(evt.price) : ""}</div>
      `;
      feedEl.appendChild(row);
      while (feedEl.children.length > MAX_ROWS) feedEl.removeChild(feedEl.firstChild);
      feedEl.scrollTop = feedEl.scrollHeight;
    }

    function handleEvent(evt) {
      appendRow(evt);
      if (evt.session_id) {
        upsertSession(evt.session_id, { vendor: evt.vendor, price: evt.price, status: evt.kind === "session_end" ? evt.detail.status : undefined });
      }
    }

    function connect() {
      sessions.clear();
      sessionsEl.innerHTML = "";
      feedEl.innerHTML = "";
      setStatus("live", "connecting…");
      if (es) es.close();
      es = new EventSource("/trace/stream");
      es.addEventListener("trace", (ev) => {
        setStatus("live", "live");
        handleEvent(JSON.parse(ev.data));
      });
      es.addEventListener("done", () => {
        setStatus("done", "done");
        es.close();
      });
      es.onerror = () => {
        setStatus("error", "disconnected — click Run again");
        es.close();
      };
    }

    reconnectBtn.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
