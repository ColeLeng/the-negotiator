<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Citable Negotiator — Live Agent Trace</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #202020;
    --text-1:      #ffffff;
    --text-2:      #c3c2b7;
    --muted:       #898781;
    --gridline:    #2c2c2a;
    --border:      rgba(255,255,255,0.14);

    --estimator:    #3987e5;
    --caller:       #199e70;
    --orchestrator: #9085e9;
    --buyer:        #3987e5;
    --seller:       #d95926;
    --guard:        #e66767;
    --blackboard:   #c98500;
    --recommendation: #0ca30c;

    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --page:        #f9f9f7;
      --surface:     #fcfcfb;
      --surface-2:   #f1f0ec;
      --text-1:      #0b0b0b;
      --text-2:      #52514e;
      --muted:       #898781;
      --gridline:    #e1e0d9;
      --border:      rgba(11,11,11,0.14);

      --estimator:    #2a78d6;
      --caller:       #1baf7a;
      --orchestrator: #4a3aa7;
      --buyer:        #2a78d6;
      --seller:       #eb6834;
      --guard:        #e34948;
      --blackboard:   #eda100;
      --recommendation: #0ca30c;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-1);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header .sub { color: var(--muted); font-size: 12px; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 11px; color: var(--text-2);
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); }
  .pill.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pill.done .dot { background: var(--estimator); }
  .pill.error .dot { background: var(--critical); }

  button.reconnect {
    margin-left: auto; background: var(--surface-2); color: var(--text-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
    font-size: 12px; cursor: pointer;
  }
  button.reconnect:hover { border-color: var(--muted); }

  main {
    flex: 1;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    gap: 10px;
    padding: 12px 16px 14px;
    min-height: 0;
  }

  .section-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------------- architecture diagram ---------------- */
  #diagram-wrap {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px 14px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #diagram-canvas {
    position: relative;
    flex: 1;
    min-height: 320px;
  }
  #diagram-canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .node {
    position: absolute;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    background: var(--surface-2);
    padding: 8px 10px;
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    cursor: pointer;
  }
  .node .title { font-size: 12px; font-weight: 600; color: var(--text-1); }
  .node .subtitle { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .node.active { box-shadow: 0 0 0 1px var(--node-color, var(--text-1)) inset; }
  .node.pulse {
    border-color: var(--node-color, var(--text-1));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color, var(--text-1)) 30%, transparent);
    background: color-mix(in srgb, var(--node-color, var(--text-1)) 12%, var(--surface-2));
  }
  .node.selected { border-color: var(--text-1); }
  .group-label {
    position: absolute;
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ---------------- live sessions ---------------- */
  #sessions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 8px;
  }
  .session-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 11px;
  }
  .session-card .vendor {
    font-size: 11.5px; color: var(--text-2);
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
  }
  .session-card .status {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); flex: none;
  }
  .session-card .status.agreed      { color: var(--good);     border-color: color-mix(in srgb, var(--good) 50%, transparent); }
  .session-card .status.walked_away { color: var(--warning);  border-color: color-mix(in srgb, var(--warning) 50%, transparent); }
  .session-card .status.refused     { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 50%, transparent); }
  .session-card .price {
    font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums;
    margin-top: 2px; transition: color 120ms ease;
  }
  .session-card .price.flash { color: var(--good); }

  /* ---------------- latest turn ---------------- */
  #latest-turn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; display: flex; align-items: center; gap: 12px; min-height: 46px;
  }
  #latest-turn .tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); flex: none;
  }
  #latest-turn .text { flex: 1; color: var(--text-1); }
  #latest-turn .text .rationale { color: var(--text-2); font-size: 12px; }
  #latest-turn .price { font-variant-numeric: tabular-nums; color: var(--text-2); flex: none; }

  #feed::-webkit-scrollbar { width: 8px; }
  #feed::-webkit-scrollbar-thumb { background: var(--gridline); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>Citable Negotiator</h1>
    <span class="sub">live agent trace</span>
    <span id="status-pill" class="pill"><span class="dot"></span><span id="status-label">connecting…</span></span>
    <button class="reconnect" id="reconnect">Run again</button>
  </header>
  <main>
    <div class="section-label">Architecture — click any box</div>
    <div id="diagram-wrap">
      <div id="diagram-canvas"></div>
    </div>
    <div id="sessions"></div>
    <div id="latest-turn">
      <span class="tag">latest turn</span>
      <span class="text" id="latest-text">waiting for the demo to start…</span>
      <span class="price" id="latest-price"></span>
    </div>
  </main>

  <script>
    // ---------------------------------------------------------------------
    // Diagram model: one node per real module in negotiator/, wired so that
    // TraceEvents (negotiator/tracing.py) light up the node that produced them.
    // Coordinates are in a 1180x400 canvas; positions are percentages so the
    // canvas can resize freely.
    // ---------------------------------------------------------------------
    const NODES = [
      { id: "estimator",      title: "Estimator",      subtitle: "text → ProductSpec",         x: 2,  y: 4,  w: 15, color: "--estimator" },
      { id: "caller",         title: "Caller",          subtitle: "search → RankedOptions",     x: 20, y: 4,  w: 15, color: "--caller" },
      { id: "orchestrator",   title: "Orchestrator",    subtitle: "spawns top-N sessions",      x: 38, y: 4,  w: 17, color: "--orchestrator" },
      { id: "recommendation", title: "Recommendation",  subtitle: "best closed deal",           x: 80, y: 4,  w: 18, color: "--recommendation" },

      { id: "guard",         title: "Guard",         subtitle: "honesty + anti-injection",  x: 38, y: 42, w: 15, color: "--guard" },
      { id: "buyer",         title: "Buyer Agent",   subtitle: "maximize utility",          x: 56, y: 42, w: 16, color: "--buyer" },
      { id: "seller",        title: "Seller Agent",  subtitle: "protect margin",            x: 75, y: 42, w: 16, color: "--seller" },

      { id: "blackboard",    title: "Blackboard",    subtitle: "shared live BATNA",         x: 56, y: 76, w: 16, color: "--blackboard" },
    ];

    const EDGES = [
      ["estimator", "caller"],
      ["caller", "orchestrator"],
      ["orchestrator", "guard"],
      ["guard", "buyer"],
      ["buyer", "seller", true],   // bidirectional
      ["buyer", "blackboard", true, true], // bidirectional, dashed
      ["orchestrator", "recommendation"],
    ];

    const canvas = document.getElementById("diagram-canvas");
    const nodeEls = {};

    function pctBox(n) {
      return { left: n.x + "%", top: n.y + "%", width: n.w + "%" };
    }

    function renderDiagram() {
      canvas.innerHTML = "";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.innerHTML = `
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path>
          </marker>
        </defs>
      `;
      const byId = Object.fromEntries(NODES.map((n) => [n.id, n]));

      for (const [fromId, toId, bidir, dashed] of EDGES) {
        const a = byId[fromId], b = byId[toId];
        const ax = a.x + a.w, ay = a.y + 4.5;
        const bx = b.x, by = b.y + 4.5;
        const sameRow = Math.abs(a.y - b.y) < 1;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        let d;
        if (sameRow) {
          d = `M ${ax} ${ay} L ${bx} ${by}`;
        } else {
          const midY = (ay + by) / 2;
          const cx = a.x + a.w / 2;
          d = `M ${cx} ${a.y + 9} L ${cx} ${midY} L ${b.x + b.w / 2} ${midY} L ${b.x + b.w / 2} ${b.y}`;
        }
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "var(--gridline)");
        path.setAttribute("stroke-width", "0.5");
        path.setAttribute("marker-end", "url(#arrow)");
        if (bidir) path.setAttribute("marker-start", "url(#arrow)");
        if (dashed) path.setAttribute("stroke-dasharray", "1.6,1.4");
        svg.appendChild(path);
      }
      canvas.appendChild(svg);

      for (const n of NODES) {
        const el = document.createElement("div");
        el.className = "node";
        el.style.setProperty("--node-color", `var(${n.color})`);
        Object.assign(el.style, pctBox(n));
        el.innerHTML = `<div class="title">${n.title}</div><div class="subtitle">${n.subtitle}</div>`;
        el.addEventListener("click", () => showNodeHistory(n.id, n.title));
        canvas.appendChild(el);
        nodeEls[n.id] = el;
      }
    }

    function pulse(nodeId) {
      const el = nodeEls[nodeId];
      if (!el) return;
      el.classList.add("active", "pulse");
      clearTimeout(el._pulseTimer);
      el._pulseTimer = setTimeout(() => el.classList.remove("pulse"), 700);
    }

    // Map a TraceEvent onto the node(s) it should light up.
    function nodesForEvent(evt) {
      if (evt.kind === "stage") return [evt.actor];                       // estimator | caller
      if (evt.kind === "session_spawned" || evt.kind === "session_end") return ["orchestrator"];
      if (evt.kind === "recommendation") return ["recommendation"];
      if (evt.kind === "blackboard_update") return ["blackboard"];
      if (evt.kind === "guard_intervention") return ["guard", evt.actor];
      if (evt.kind === "message") return [evt.actor];                     // buyer | seller
      return [];
    }

    // ---------------------------------------------------------------------
    // Live sessions + latest-turn strip + SSE wiring
    // ---------------------------------------------------------------------
    const sessionsEl = document.getElementById("sessions");
    const statusPill = document.getElementById("status-pill");
    const statusLabel = document.getElementById("status-label");
    const reconnectBtn = document.getElementById("reconnect");
    const latestText = document.getElementById("latest-text");
    const latestPrice = document.getElementById("latest-price");

    const sessions = new Map();
    const allEvents = [];
    let es = null;

    function setStatus(kind, text) {
      statusPill.className = "pill " + kind;
      statusLabel.textContent = text;
    }

    function fmtUsd(n) {
      if (n === null || n === undefined || Number.isNaN(n)) return "—";
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);
    }

    function sessionCard(sessionId, vendor) {
      const card = document.createElement("div");
      card.className = "session-card";
      card.innerHTML = `<div class="vendor"><span>${vendor || sessionId}</span><span class="status"></span></div><div class="price">—</div>`;
      sessionsEl.appendChild(card);
      return { statusEl: card.querySelector(".status"), priceEl: card.querySelector(".price") };
    }

    function upsertSession(sessionId, { vendor, price, status }) {
      let s = sessions.get(sessionId);
      if (!s) { s = { ...sessionCard(sessionId, vendor) }; sessions.set(sessionId, s); }
      if (status) { s.statusEl.textContent = status; s.statusEl.className = "status " + status; }
      if (price !== null && price !== undefined) {
        s.priceEl.textContent = fmtUsd(price);
        s.priceEl.classList.add("flash");
        setTimeout(() => s.priceEl.classList.remove("flash"), 220);
      }
    }

    function showNodeHistory(nodeId, title) {
      const related = allEvents.filter((e) => nodesForEvent(e).includes(nodeId)).slice(-1)[0];
      if (related) {
        latestText.innerHTML = `<strong>${title}</strong> — ${related.label}` +
          (related.detail && related.detail.rationale ? `<span class="rationale"><br/>${related.detail.rationale}</span>` : "");
        latestPrice.textContent = related.price != null ? fmtUsd(related.price) : "";
      } else {
        latestText.innerHTML = `<strong>${title}</strong> — no events yet`;
        latestPrice.textContent = "";
      }
      Object.values(nodeEls).forEach((el) => el.classList.remove("selected"));
      nodeEls[nodeId]?.classList.add("selected");
    }

    function handleEvent(evt) {
      allEvents.push(evt);
      for (const nodeId of nodesForEvent(evt)) pulse(nodeId);

      latestText.innerHTML = `<strong>${(evt.actor || evt.kind).toString().replace("_", " ")}</strong> — ${evt.label}` +
        (evt.detail && evt.detail.rationale ? `<span class="rationale"><br/>${evt.detail.rationale}</span>` : "");
      latestPrice.textContent = evt.price != null ? fmtUsd(evt.price) : "";

      if (evt.session_id) {
        upsertSession(evt.session_id, {
          vendor: evt.vendor,
          price: evt.price,
          status: evt.kind === "session_end" ? evt.detail.status : undefined,
        });
      }
    }

    function connect() {
      sessions.clear();
      allEvents.length = 0;
      sessionsEl.innerHTML = "";
      latestText.textContent = "waiting for the demo to start…";
      latestPrice.textContent = "";
      Object.values(nodeEls).forEach((el) => el.classList.remove("active", "pulse", "selected"));
      setStatus("live", "connecting…");
      if (es) es.close();
      es = new EventSource("/trace/stream");
      es.addEventListener("trace", (ev) => { setStatus("live", "live"); handleEvent(JSON.parse(ev.data)); });
      es.addEventListener("done", () => { setStatus("done", "done"); es.close(); });
      es.onerror = () => { setStatus("error", "disconnected — click Run again"); es.close(); };
    }

    renderDiagram();
    reconnectBtn.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
